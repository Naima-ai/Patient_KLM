version: "3.9"

services:
  patient-klm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patient_klm
    ports:
      - "8001:8001"
    environment:
      - PATIENT_KLM_DB_PATH=/app/data/patient_klm.db
    volumes:
      # Mount data folder so the seeded DB persists across restarts
      - ./data:/app/data
    restart: unless-stopped
